apiVersion: apps/v1
kind: Deployment
metadata:
  name: maalinger-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: maalinger-api
  template:
    metadata:
      labels:
        app: maalinger-api
    spec:
      containers:
        - name: api
          image: maalinger-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: maalinger-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
